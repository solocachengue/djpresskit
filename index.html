<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  /* ═══════════════════════════════════════════════════════════════════
     ESKAY DA REAL — DESIGN SYSTEM TOKENS
     Copper foil stamped on black, shot through film grain.
     ═══════════════════════════════════════════════════════════════════ */
  :root {
    /* copper foil ramp — the single brand hue */
    --copper-100:#F7C6A5; --copper-200:#F2A77C; --copper-300:#E8926A; --copper-400:#DD8258;
    --copper-500:#D07249; --copper-600:#B4613C; --copper-700:#8A462A; --copper-800:#5C2E1B;
    /* ink — near-black stage darks */
    --ink-900:#000000; --ink-850:#080707; --ink-800:#0C0B0B; --ink-700:#141212;
    --ink-600:#1C1A19; --ink-500:#2A2726; --ink-400:#3D3937;
    /* paper — warm-neutral off-whites */
    --paper-000:#FFFFFF; --paper-100:#F4F3F1; --paper-200:#EDECEA; --paper-300:#E2E0DD; --paper-400:#CFCCC8;
    --grey-500:#8C8A87; --grey-600:#5E5B59; --grey-700:#403D3B;

    /* surfaces */
    --surface-stage:var(--ink-800); --surface-stage-deep:var(--ink-900);
    --surface-raised:var(--ink-700); --surface-paper:var(--paper-100);

    /* text */
    --text-strong:var(--paper-000);
    --text-body:rgba(255,255,255,.86);
    --text-muted:rgba(255,255,255,.52);
    --text-faint:rgba(255,255,255,.28);
    --text-strong-on-paper:var(--ink-800);
    --text-body-on-paper:rgba(12,11,11,.86);
    --text-muted-on-paper:rgba(12,11,11,.5);

    /* accents + rules */
    --accent:var(--copper-300); --accent-strong:var(--copper-500);
    --accent-on-paper:var(--copper-600); --accent-quiet:rgba(232,146,106,.5);
    --rule-on-stage:rgba(255,255,255,.14); --rule-accent:var(--copper-600);
    --rule-on-paper:rgba(12,11,11,.14); --focus-ring:var(--copper-300);

    /* type */
    --font-display:"Figtree",-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-body:var(--font-display);
    --mono-font:'JetBrains Mono', monospace;
    --fw-light:300; --fw-regular:400; --fw-bold:700; --fw-black:800;
    --lh-display:.92; --lh-body:1.55;
    --ls-display:-.03em; --ls-eyebrow:.42em; --ls-label:.14em; --ls-index:.06em;

    /* spacing */
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px;
    --space-6:32px; --space-7:48px; --space-8:64px; --space-9:96px;
    --radius-none:0px; --radius-circle:50%;

    /* foil */
    --foil-copper:linear-gradient(104deg,#B4613C 0%,#E8926A 18%,#F7C6A5 32%,#DD8258 46%,#B4613C 62%,#F2A77C 78%,#C96D44 100%);
    --foil-white:linear-gradient(104deg,#CFCCC8 0%,#FFFFFF 26%,#E2E0DD 52%,#FFFFFF 74%,#CFCCC8 100%);

    /* grain — see .grain below for why each plate blends the way it does */
    --grain-dark:url("assets/texture-grain-medium.png");
    --grain-light:url("assets/texture-paper-medium.png");
    --grain-blend-dark:screen;
    --grain-blend-paper:multiply;
    --grain-opacity-dark:.55;
    --grain-opacity-paper:.5;

    /* scrims */
    --scrim-bottom:linear-gradient(180deg,rgba(8,7,7,0) 0%,rgba(8,7,7,.72) 62%,rgba(8,7,7,.94) 100%);
    --scrim-full:linear-gradient(180deg,rgba(8,7,7,.55) 0%,rgba(8,7,7,.35) 45%,rgba(8,7,7,.85) 100%);
    --scrim-left:linear-gradient(90deg,rgba(8,7,7,.92) 0%,rgba(8,7,7,.55) 45%,rgba(8,7,7,0) 100%);

    /* shadows — print-object shadows */
    --shadow-photo:0 40px 90px rgba(0,0,0,.55);
    --shadow-object:0 24px 60px rgba(0,0,0,.45);
    --shadow-card-paper:0 18px 44px rgba(12,11,11,.12);

    /* motion — slow, filmic; nothing bounces */
    --ease-out:cubic-bezier(.16,1,.3,1);
    --dur-fast:140ms; --dur-base:280ms; --dur-reveal:900ms;

    /* imagery */
    --filter-bw:grayscale(1) contrast(1.08);
    --filter-warm:sepia(.18) saturate(1.05) contrast(1.04);

    /* runtime — el tablero activo lo fija la app */
    --sw:1280px; --sh:655px;
    --spread-scale:1;
    --image-opacity:1;
  }

  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; background:#050404; color:var(--text-body);
    font-family:var(--font-body); -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  ::selection { background:var(--copper-600); color:var(--paper-000); }
  :focus-visible { outline:2px solid var(--focus-ring); outline-offset:3px; }

  /* ══════════════ STAGE ══════════════ */
  .stage {
    min-height:100vh; padding:88px 20px 80px;
    display:flex; flex-direction:column; align-items:center;
    background:
      radial-gradient(1200px 600px at 50% -240px, rgba(232,146,106,.07), transparent 62%),
      #050404;
  }
  #root { width:100%; display:flex; flex-direction:column; align-items:center; }
  .book { width:100%; display:flex; flex-direction:column; align-items:center; gap:26px; }

  /* ══════════════ SPREAD — 1280×655 design size, scaled ══════════════ */
  .spread-frame {
    position:relative; flex:0 0 auto;
    width:calc(var(--sw) * var(--spread-scale));
    height:calc(var(--sh) * var(--spread-scale));
  }
  .spread-frame > .spread-scaler {
    position:absolute; top:0; left:0;
    width:var(--sw); height:var(--sh);
    transform:scale(var(--spread-scale)); transform-origin:top left;
  }
  .spread {
    position:relative; width:var(--sw); height:var(--sh); overflow:hidden;
    background:var(--surface-stage); color:var(--text-body);
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 40px 90px -30px rgba(0,0,0,.9);
  }

  /* Film grain — every surface carries it.
     Blend mode follows the plate, not habit. The dark plate is a near-black
     field (luma ~11/255) whose grain lives in its bright specks, so it has to
     SCREEN to lift them out; overlaid on a near-black ground it would multiply
     down to flat black and erase itself. The paper plate is the mirror case:
     near-white (luma ~246/255) with the fibre in its darker flecks, so it
     MULTIPLIES. Neither one works with `overlay`. */
  .grain {
    position:absolute; inset:0; pointer-events:none; z-index:6;
    background-image:var(--grain-dark); background-size:400px 400px;
    opacity:var(--grain-opacity-dark); mix-blend-mode:var(--grain-blend-dark);
  }
  .grain--paper {
    background-image:var(--grain-light); opacity:var(--grain-opacity-paper);
    mix-blend-mode:var(--grain-blend-paper);
  }

  /* ══════════════ DS PRIMITIVES ══════════════ */
  .ds-display {
    margin:0; font-family:var(--font-display); font-weight:var(--fw-black);
    line-height:var(--lh-display); letter-spacing:var(--ls-display);
    text-transform:lowercase;
  }
  .ds-display.foil {
    background-image:var(--foil-copper); -webkit-background-clip:text;
    background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
  }
  .ds-display.ink   { color:var(--ink-800); }
  .ds-display.paper { color:var(--paper-000); }

  .ds-eyebrow {
    font-family:var(--font-display); font-weight:var(--fw-light);
    letter-spacing:var(--ls-eyebrow); text-transform:uppercase; font-size:13px;
  }
  .ds-eyebrow.on-stage { color:var(--accent); }
  .ds-eyebrow.on-paper { color:var(--accent-on-paper); }

  .ds-heading { display:flex; flex-direction:column; gap:var(--space-4); }

  .ds-bio {
    font-family:var(--font-body); font-weight:400; line-height:var(--lh-body);
    text-align:justify; hyphens:auto;
    display:flex; flex-direction:column; gap:var(--space-5);
  }
  .ds-bio.on-paper { color:var(--text-body-on-paper); }
  .ds-bio.on-stage { color:var(--text-body); }
  .ds-bio p { margin:0; }

  .ds-ghost {
    position:absolute; left:0; right:0; font-family:var(--font-display);
    font-weight:var(--fw-black); line-height:.8; letter-spacing:var(--ls-display);
    text-transform:lowercase; white-space:nowrap; pointer-events:none;
    user-select:none; z-index:2;
  }

  /* index list — numbering is content, not decoration */
  .ds-index { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; }
  .ds-index-row {
    position:relative; display:flex; align-items:center; gap:var(--space-4); list-style:none;
  }
  .ds-index-n {
    font-family:var(--font-display); font-weight:400; font-size:var(--index-fs,15px);
    letter-spacing:var(--ls-index); color:var(--accent); min-width:2.6em; flex:0 0 auto;
  }
  .ds-index-rule { height:1px; background:var(--rule-accent); flex:0 0 auto; }
  .ds-index-label {
    font-family:var(--font-display); font-weight:var(--fw-bold); font-size:var(--index-fs,15px);
    letter-spacing:var(--ls-index); text-transform:uppercase; white-space:nowrap;
  }
  .ds-index-row.on-stage .ds-index-label { color:var(--text-strong); }
  .ds-index-row.on-paper .ds-index-label { color:var(--text-strong-on-paper); }
  .ds-index-detail {
    font-weight:400; text-transform:none; letter-spacing:0;
  }
  .ds-index-row.on-stage .ds-index-detail { color:var(--text-muted); }
  .ds-index-row.on-paper .ds-index-detail { color:var(--text-muted-on-paper); }

  /* social */
  .ds-social-row { display:flex; flex-wrap:wrap; align-items:center; }
  .ds-social-row a, .ds-social-rail a {
    display:flex; align-items:center; gap:var(--space-3);
    text-decoration:none; color:var(--text-strong);
    font-family:var(--font-body); font-size:15px;
    transition:opacity var(--dur-fast) var(--ease-out);
  }
  .ds-social-row a:hover, .ds-social-rail a:hover { opacity:.72; }
  .ds-social-rail { display:flex; flex-direction:column; align-items:center; }
  .ds-icon { display:inline-block; flex:0 0 auto; background-color:var(--accent); }

  /* Decorative overlays: protection scrims, the torn-paper wedge, the copper
     edge bar. They are painted above the full-bleed photo slots, so without
     this they swallow the click that opens the file picker and the photo
     underneath becomes impossible to replace. Nothing here is interactive. */
  .deco { pointer-events:none; }

  /* Content layers are stretched across the whole spread (inset:0) to position
     their columns, so as solid hit targets they would blanket the full-bleed
     photo slot underneath and make it unclickable everywhere, not just where
     the text is. The layer itself is transparent to the pointer; only the
     leaves that are actually interactive take clicks back. */
  .layer { pointer-events:none; }
  .layer :is([contenteditable], a, button, input, label, .upload) { pointer-events:auto; }

  /* ══════════════ EDITING ══════════════ */
  [contenteditable="true"] { outline:none; }
  [contenteditable="true"]:hover { box-shadow:inset 0 -1px 0 0 var(--accent-quiet); }
  [contenteditable="true"]:focus {
    box-shadow:inset 0 0 0 1px var(--accent-quiet);
    background:rgba(232,146,106,.08);
  }
  .is-editing .spread { outline:1px dashed rgba(232,146,106,.3); outline-offset:-2px; }

  /* image upload slots */
  .upload { position:relative; cursor:pointer; overflow:hidden; background-color:rgba(255,255,255,.02); }
  .upload input[type="file"] { display:none; }
  .upload .hint {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px;
    font-family:var(--mono-font); font-size:10px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--text-muted);
    background:
      repeating-linear-gradient(45deg, rgba(232,146,106,.06) 0 2px, transparent 2px 12px),
      rgba(255,255,255,.02);
    border:1px dashed var(--rule-on-stage);
  }
  .upload .hint .icon {
    width:34px; height:34px; border-radius:var(--radius-circle);
    background:rgba(232,146,106,.18); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:300;
  }
  .upload.on-paper .hint {
    color:var(--text-muted-on-paper); border-color:var(--rule-on-paper);
    background:
      repeating-linear-gradient(45deg, rgba(180,97,60,.08) 0 2px, transparent 2px 12px),
      rgba(12,11,11,.02);
  }
  .upload .hint.align-top    { justify-content:flex-start; padding-top:16px; }
  .upload .hint.align-bottom { justify-content:flex-end; padding-bottom:16px; }
  .upload.has-image .hint { display:none; }
  /* Prop slots hold cut-out objects (headphones, vinyl, sticker, sprays, logos).
     They must not paint a box behind the object's transparency. */
  .upload.is-prop { background-color:transparent; }
  .upload.is-prop.has-image::before { content:none; }
  .upload.is-prop .hint { font-size:9px; letter-spacing:.12em; gap:6px; }
  /* El modo de fusión del mark de fondo lo decide la app midiendo el plato de
     la imagen (ver autoBlend en ImageSlot), no una regla fija. */
  .upload.is-prop .hint .icon { width:26px; height:26px; font-size:15px; }
  .upload.has-image::before {
    content:""; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:rgba(0,0,0, calc(1 - var(--image-opacity, 1)));
  }
  .slot-badge {
    position:absolute; left:0; top:0; z-index:8; pointer-events:none;
    max-width:100%; padding:4px 8px; background:rgba(12,11,11,.88);
    border-right:1px solid var(--accent-quiet); border-bottom:1px solid var(--accent-quiet);
    font-family:var(--mono-font); font-size:9px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  .img-control {
    position:absolute; z-index:9; width:28px; height:28px;
    background:rgba(12,11,11,.9); backdrop-filter:blur(6px);
    border:1px solid var(--accent-quiet); color:var(--paper-000);
    border-radius:var(--radius-circle); cursor:pointer; font-size:12px;
    display:none; align-items:center; justify-content:center;
    transition:background var(--dur-fast) var(--ease-out);
  }
  .upload.has-image:hover .img-control { display:flex; }
  .img-control:hover { background:var(--copper-500); }
  .img-opacity-btn { top:8px; right:42px; }
  .img-remove-btn  { top:8px; right:8px; }
  .img-slider-pop {
    position:absolute; top:44px; right:8px; z-index:10;
    background:rgba(12,11,11,.95); backdrop-filter:blur(8px);
    border:1px solid var(--accent-quiet); padding:10px 12px;
    display:flex; flex-direction:column; gap:6px; width:190px;
  }
  .img-slider-pop label {
    font-family:var(--mono-font); font-size:9px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent);
  }
  .img-slider-pop input[type="range"] { width:100%; accent-color:var(--copper-400); }
  .img-slider-pop span { font-family:var(--mono-font); font-size:10px; color:var(--text-muted); text-align:right; }

  /* row add / remove controls */
  .row-rm {
    position:absolute; left:-30px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border:none; border-radius:var(--radius-circle);
    background:rgba(208,114,73,.9); color:#fff; font-size:10px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .add-row {
    margin-top:var(--space-4); padding:8px 14px; background:transparent;
    border:1px dashed var(--accent-quiet); color:var(--accent);
    font-family:var(--mono-font); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; cursor:pointer; width:fit-content;
    transition:background var(--dur-fast) var(--ease-out);
  }
  .add-row:hover { background:rgba(232,146,106,.1); }
  .add-row.on-paper { border-color:rgba(180,97,60,.5); color:var(--accent-on-paper); }

  /* ══════════════ TOP BAR ══════════════ */
  .topbar {
    position:fixed; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:10px; padding:14px 18px;
    background:linear-gradient(180deg, rgba(5,4,4,.96) 0%, rgba(5,4,4,.72) 70%, transparent 100%);
    backdrop-filter:blur(10px);
  }
  .topbar-mark {
    font-family:var(--font-display); font-weight:var(--fw-black); font-size:17px;
    letter-spacing:var(--ls-display); text-transform:lowercase;
    background-image:var(--foil-copper); -webkit-background-clip:text;
    background-clip:text; color:transparent; margin-right:6px;
  }
  .topbar-spacer { flex:1; }
  .tb-btn {
    background:rgba(20,18,18,.9); color:var(--paper-000);
    border:1px solid var(--rule-on-stage); padding:9px 15px;
    font-family:var(--mono-font); font-size:10.5px; font-weight:600;
    letter-spacing:var(--ls-label); text-transform:uppercase; cursor:pointer;
    transition:border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
  }
  .tb-btn:hover { border-color:var(--accent); color:var(--accent); }
  .tb-btn.active { background:var(--copper-500); border-color:var(--copper-500); color:var(--paper-000); }
  .tb-btn.primary { background:var(--copper-500); border-color:var(--copper-500); color:var(--paper-000); }
  .tb-btn.primary:hover { background:var(--copper-400); border-color:var(--copper-400); color:var(--paper-000); }

  /* ══════════════ MODALS ══════════════ */
  .modal {
    position:fixed; inset:0; z-index:2000; background:rgba(5,4,4,.93);
    backdrop-filter:blur(12px); display:flex; align-items:center;
    justify-content:center; padding:24px;
  }
  .modal-inner {
    width:min(900px,100%); max-height:90vh; overflow-y:auto;
    background:var(--ink-700); border:1px solid var(--rule-on-stage); padding:30px;
  }
  .modal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .modal-head h2 {
    margin:0; font-family:var(--font-display); font-weight:var(--fw-black);
    font-size:38px; line-height:.92; letter-spacing:var(--ls-display); text-transform:lowercase;
    background-image:var(--foil-copper); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .modal-close {
    background:transparent; border:1px solid var(--rule-on-stage); color:var(--paper-000);
    width:36px; height:36px; cursor:pointer; font-size:15px;
  }
  .modal-close:hover { border-color:var(--accent); color:var(--accent); }
  .modal-hint {
    font-family:var(--mono-font); font-size:11px; color:var(--text-muted);
    letter-spacing:.05em; line-height:1.6; margin:0 0 22px;
  }
  .modal-section {
    font-family:var(--font-display); font-weight:var(--fw-light); font-size:12px;
    letter-spacing:var(--ls-eyebrow); text-transform:uppercase; color:var(--accent);
    margin:26px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--rule-on-stage);
  }
  .modal-section:first-of-type { margin-top:0; }

  /* preset cards */
  .preset-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .preset-card {
    cursor:pointer; text-align:left; padding:0; overflow:hidden;
    background:var(--ink-800); border:1px solid var(--rule-on-stage);
    color:var(--paper-000); font-family:inherit;
    transition:border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .preset-card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .preset-card.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(232,146,106,.28); }
  .preset-thumb {
    aspect-ratio:1280/655; position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
  }
  .preset-thumb-name {
    font-family:var(--font-display); font-weight:var(--fw-black); font-size:34px;
    letter-spacing:var(--ls-display); text-transform:lowercase;
    background-image:var(--foil-copper); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .preset-thumb-sub {
    font-family:var(--font-display); font-weight:var(--fw-light); font-size:8px;
    letter-spacing:var(--ls-eyebrow); text-transform:uppercase; color:var(--copper-600);
  }
  .preset-info { padding:12px 14px; border-top:1px solid var(--rule-on-stage); }
  .preset-name {
    font-family:var(--font-display); font-weight:var(--fw-bold); font-size:14px;
    letter-spacing:var(--ls-index); text-transform:uppercase; color:var(--paper-000);
  }
  .preset-desc {
    font-family:var(--mono-font); font-size:10px; color:var(--text-muted);
    margin-top:4px; line-height:1.5;
  }

  /* print guide */
  .print-steps { margin:0 0 18px; padding:0 0 0 20px; display:flex; flex-direction:column; gap:12px; }
  .print-steps li {
    font-family:var(--font-body); font-size:13px; line-height:1.6;
    color:var(--text-body); padding-left:4px;
  }
  .print-steps li::marker { color:var(--accent); font-weight:700; }
  .print-steps b { color:var(--paper-000); }
  .print-steps code {
    font-family:var(--mono-font); font-size:11px; color:var(--accent);
    background:rgba(232,146,106,.1); padding:1px 6px;
  }
  .print-steps span { display:block; margin-top:3px; font-size:11.5px; color:var(--text-muted); }

  /* format picker */
  .fmt-row { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .fmt-card {
    display:flex; flex-direction:column; align-items:center; gap:7px; cursor:pointer;
    padding:16px 10px; background:var(--ink-800); border:1px solid var(--rule-on-stage);
    color:var(--paper-000); font-family:inherit; text-align:center;
    transition:border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .fmt-card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .fmt-card.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(232,146,106,.28); }
  .fmt-shape { display:block; border:1.5px solid var(--accent); }
  .fmt-shape.landscape { width:44px; height:23px; }
  .fmt-shape.portrait  { width:24px; height:32px; }
  .fmt-shape.auto {
    width:36px; height:28px; border-style:dashed;
  }
  .fmt-name { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .fmt-desc { font-family:var(--mono-font); font-size:9.5px; color:var(--text-muted); line-height:1.4; }

  /* style modal — hue, film stock, deploy */
  .swatches { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .swatch {
    width:42px; height:42px; padding:0; cursor:pointer; position:relative;
    border:1px solid var(--rule-on-stage); background:transparent;
    transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
  }
  .swatch:hover { transform:translateY(-2px); border-color:var(--paper-000); }
  .swatch.active { border-color:var(--paper-000); box-shadow:0 0 0 2px rgba(255,255,255,.25); }
  .swatch-fill { position:absolute; inset:3px; }
  .swatch-name {
    font-family:var(--mono-font); font-size:9px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--text-muted);
  }
  .hue-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:14px; }
  .hue-row input[type="color"] {
    width:52px; height:42px; padding:0; cursor:pointer;
    background:transparent; border:1px solid var(--rule-on-stage);
  }
  .hue-hex {
    font-family:var(--mono-font); font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--paper-000);
    background:var(--ink-800); border:1px solid var(--rule-on-stage);
    padding:11px 12px; width:110px;
  }
  .ramp-strip { display:flex; height:34px; flex:1; min-width:200px; }
  .ramp-strip span { flex:1; }

  .texture-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .texture-card {
    cursor:pointer; padding:0; overflow:hidden; text-align:left; font-family:inherit;
    background:var(--ink-800); border:1px solid var(--rule-on-stage); color:var(--paper-000);
    transition:border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .texture-card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .texture-card.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(232,146,106,.28); }
  .texture-swatch { height:74px; position:relative; background:var(--ink-800); }
  .texture-swatch .tex {
    position:absolute; inset:0; background-size:400px 400px;
    mix-blend-mode:screen; opacity:.85;
  }
  .texture-swatch.paper { background:var(--paper-100); }
  .texture-swatch.paper .tex { mix-blend-mode:multiply; opacity:.9; }
  .texture-info { padding:9px 11px; border-top:1px solid var(--rule-on-stage); }
  .texture-name { font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .texture-desc { font-family:var(--mono-font); font-size:9.5px; color:var(--text-muted); margin-top:3px; }

  .slider-row { display:flex; align-items:center; gap:14px; margin-top:16px; }
  .slider-row input[type="range"] { flex:1; accent-color:var(--copper-400); }
  .slider-row label, .slider-row output {
    font-family:var(--mono-font); font-size:10px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--text-muted); white-space:nowrap;
  }
  .slider-row output { color:var(--accent); min-width:46px; text-align:right; }

  .deploy-row { display:flex; gap:12px; flex-wrap:wrap; }
  .deploy-btn {
    display:inline-flex; align-items:center; gap:10px; text-decoration:none;
    padding:14px 20px; border:1px solid var(--rule-on-stage); background:var(--ink-800);
    color:var(--paper-000); font-family:var(--mono-font); font-size:11px;
    font-weight:700; letter-spacing:var(--ls-label); text-transform:uppercase;
    transition:border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .deploy-btn:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }
  .deploy-btn svg { width:17px; height:17px; flex:0 0 auto; }
  button.deploy-btn { cursor:pointer; }
  .modal-hint code {
    font-family:var(--mono-font); font-size:10.5px; color:var(--accent);
    background:rgba(232,146,106,.1); padding:1px 5px;
  }

  /* social links editor */
  .link-list { display:flex; flex-direction:column; gap:7px; }
  .link-row {
    display:grid; grid-template-columns:28px 108px 1fr 1.5fr auto; gap:9px; align-items:center;
    padding:8px 10px; background:rgba(255,255,255,.03); border:1px solid var(--rule-on-stage);
  }
  .link-icon { display:flex; align-items:center; justify-content:center; }
  .link-row select, .link-row input {
    font-family:var(--mono-font); font-size:11px; color:var(--paper-000);
    background:var(--ink-800); border:1px solid var(--rule-on-stage);
    padding:7px 8px; min-width:0; width:100%;
  }
  .link-row select { cursor:pointer; }
  .link-row input:focus, .link-row select:focus { outline:none; border-color:var(--accent); }
  .link-ctrl { display:flex; gap:4px; }
  .link-ctrl button {
    width:26px; height:26px; border:1px solid var(--rule-on-stage);
    background:rgba(232,146,106,.07); color:var(--paper-000);
    cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .link-ctrl button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .link-ctrl button.danger:hover { background:var(--copper-500); border-color:var(--copper-500); color:#fff; }
  .link-ctrl button:disabled { opacity:.3; cursor:not-allowed; }
  @media (max-width: 860px) {
    .link-row { grid-template-columns:28px 1fr auto; }
    .link-row select { grid-column:2 / span 1; }
    .link-row input { grid-column:2 / span 1; }
  }

  /* spread builder */
  .builder-list { display:flex; flex-direction:column; gap:6px; }
  .builder-item {
    display:grid; grid-template-columns:34px 1fr auto; gap:14px; align-items:center;
    padding:11px 14px; background:rgba(255,255,255,.03); border:1px solid var(--rule-on-stage);
  }
  .builder-item-num { font-family:var(--mono-font); font-size:11px; color:var(--accent); font-weight:700; }
  .builder-item-name { font-size:13px; color:var(--paper-000); font-weight:600; }
  .builder-item-desc { font-family:var(--mono-font); font-size:10px; color:var(--text-muted); margin-top:3px; }
  .builder-item-ctrl { display:flex; gap:5px; }
  .builder-item-ctrl button {
    width:28px; height:28px; border:1px solid var(--rule-on-stage);
    background:rgba(232,146,106,.07); color:var(--paper-000);
    cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center;
  }
  .builder-item-ctrl button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  .builder-item-ctrl button.danger:hover { background:var(--copper-500); border-color:var(--copper-500); color:#fff; }
  .builder-item-ctrl button:disabled { opacity:.3; cursor:not-allowed; }
  .builder-add-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px; }
  .builder-add-card {
    text-align:left; padding:14px; cursor:pointer; color:var(--paper-000); font-family:inherit;
    background:rgba(232,146,106,.05); border:1px solid var(--rule-on-stage);
    transition:border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  }
  .builder-add-card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .builder-add-name { font-size:13px; font-weight:700; margin-bottom:4px; }
  .builder-add-desc { font-family:var(--mono-font); font-size:10px; color:var(--text-muted); line-height:1.45; margin-bottom:8px; }
  .builder-add-plus {
    font-family:var(--mono-font); font-size:9px; letter-spacing:.18em;
    color:var(--accent); font-weight:700;
  }

  /* tweaks panel overrides */
  [data-tweaks-panel] button, .tweaks-panel button { color:#fff !important; }
  [data-tweaks-panel] input[type="text"], [data-tweaks-panel] input[type="number"],
  .tweaks-panel input[type="text"], .tweaks-panel input[type="number"] { color:#0C0B0B !important; }

  /* ══════════════ RESPONSIVE ══════════════ */
  @media (max-width: 860px) {
    .stage { padding:118px 10px 60px; }
    .topbar { flex-wrap:wrap; gap:7px; padding:10px 10px; }
    .tb-btn { padding:7px 10px; font-size:9px; letter-spacing:.1em; }
    .topbar-mark { font-size:15px; width:100%; margin-bottom:2px; }
    .topbar-spacer { display:none; }
    .modal { padding:10px; }
    .modal-inner { padding:18px; max-height:94vh; }
    .modal-head h2 { font-size:28px; }
    .preset-grid { grid-template-columns:1fr; }
    .builder-add-grid { grid-template-columns:1fr 1fr; }
  }

  /* ══════════════ PRINT — landscape spread pages ══════════════
     The spread is 1.954:1, so we print to a custom page of the same
     ratio instead of letterboxing it onto A4. */
  @media print {
    /* El tamaño de hoja lo estampa la app en #print-page-size según el tablero. */
    @page { margin: 0; }
    html, body {
      background:#fff !important;
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
    }
    .stage { padding:0 !important; background:none !important; min-height:0 !important; }
    #root { width:100% !important; }
    .book { gap:0 !important; }

    .spread-frame {
      page-break-after:always !important; break-after:page !important;
      page-break-inside:avoid !important; break-inside:avoid !important;
      overflow:hidden !important; position:relative !important; max-width:none !important;
    }
    .spread-frame:last-child { page-break-after:auto !important; break-after:auto !important; }
    .spread-frame > .spread-scaler { transform-origin:top left !important; }
    .spread {
      box-shadow:none !important; outline:none !important;
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
    }
    .upload, .upload * {
      -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important;
    }
    /* hide all chrome */
    .topbar, [data-tweaks-panel], .tweaks-panel, .modal,
    .img-control, .img-slider-pop, .row-rm, .add-row { display:none !important; }
    .upload .hint { display:none !important; }
    [contenteditable] {
      outline:none !important; box-shadow:none !important; background:transparent !important;
    }
    a { text-decoration:none !important; color:inherit !important; }
  }
</style>
</head>
<body>
<div class="stage">
  <div id="root"></div>
</div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="design-system.jsx"></script>
<script type="text/babel" src="presskit.jsx"></script>

</body>
</html>
