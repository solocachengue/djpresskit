<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DJ Presskit — Template</title>
<template id="__bundler_thumbnail" data-bg-color="#0a0608">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0a0608"/>
    <text x="600" y="380" text-anchor="middle" font-family="Impact, sans-serif" font-size="180" font-weight="900" fill="#ff2bd6">DJ</text>
    <text x="600" y="500" text-anchor="middle" font-family="monospace" font-size="40" letter-spacing="8" fill="#f7f2f5">PRESSKIT</text>
    <circle cx="600" cy="600" r="6" fill="#ff2bd6"/>
  </svg>
</template>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Anton&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:wght@400;700;900&family=DM+Serif+Display&family=Rubik+Mono+One&family=Major+Mono+Display&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --bg: #0a0608;
    --surface: #120a10;
    --ink: #f7f2f5;
    --ink-soft: #b9a9b3;
    --ink-dim: #6b5d65;
    --line: rgba(255,255,255,0.08);
    --accent: #ff2bd6;
    --accent-soft: rgba(255,43,214,0.18);
    --accent-glow: rgba(255,43,214,0.55);
    --display-font: 'Anton', 'Bebas Neue', sans-serif;
    --body-font: 'Inter', system-ui, sans-serif;
    --mono-font: 'JetBrains Mono', monospace;
    --page-bg: var(--bg);
    --image-opacity: 1;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #050304;
    color: var(--ink);
    font-family: var(--body-font);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Top buttons */
  .download-btn {
    position: fixed; top: 16px; right: 16px; z-index: 1000;
    background: var(--accent); color: #0a0608; border: none;
    padding: 10px 18px; border-radius: 999px;
    font-family: var(--mono-font); font-size: 11px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 4px 24px var(--accent-soft);
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.15s;
  }
  .download-btn:hover { transform: translateY(-2px); }
  .download-btn svg { width: 14px; height: 14px; }

  .edit-toggle, .templates-btn {
    position: fixed; top: 16px; z-index: 1000;
    background: rgba(20,10,16,0.9); backdrop-filter: blur(8px);
    color: var(--ink); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 999px;
    font-family: var(--mono-font); font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .edit-toggle { left: 16px; }
  .templates-btn { left: 130px; }
  .edit-toggle:hover, .templates-btn:hover { border-color: var(--accent-soft); color: var(--accent); }
  .edit-toggle.active { background: var(--accent); color: #0a0608; border-color: var(--accent); }

  /* Stage */
  .stage {
    min-height: 100vh; padding: 32px 16px 80px;
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(255,43,214,0.10), transparent 60%),
      radial-gradient(800px 600px at 50% 110%, rgba(120,40,180,0.10), transparent 60%),
      #050304;
  }
  #root { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }

  /* PAGE — A4-ish ratio */
  .page {
    width: min(440px, 100%);
    aspect-ratio: 210 / 297;
    background: var(--page-bg);
    color: var(--ink);
    border-radius: 14px;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 30px 60px -20px rgba(255,43,214,0.15),
      0 60px 120px -40px rgba(0,0,0,0.8);
    padding: 28px 26px 56px;
    display: flex; flex-direction: column;
  }
  .page-cover { padding: 0; aspect-ratio: 210 / 297; }

  /* Page header */
  .page-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 18px;
  }
  .page-num {
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 700;
  }
  .page-line { flex: 1; height: 1px; background: var(--line); }
  .page-title {
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--ink-dim);
  }

  /* Page footer */
  .page-footer {
    position: absolute; bottom: 16px; left: 26px; right: 26px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-dim);
    border-top: 1px solid var(--line); padding-top: 10px;
  }
  .pf-mark { color: var(--ink-soft); }
  .pf-num { color: var(--accent); font-weight: 700; }

  /* Page H2 */
  .page-h2 {
    font-family: var(--display-font); font-weight: 400;
    font-size: 64px; line-height: 0.86;
    letter-spacing: 0.01em; margin: 0 0 18px;
    text-transform: uppercase;
  }
  .page-h2 .accent { color: var(--accent); }

  /* Editable hover/focus */
  [contenteditable="true"] { outline: none; }
  [contenteditable="true"]:hover {
    box-shadow: inset 0 -1px 0 0 var(--accent-soft);
    border-radius: 2px;
  }
  [contenteditable="true"]:focus {
    box-shadow: inset 0 0 0 1px var(--accent-soft);
    background: rgba(255,43,214,0.06);
    border-radius: 4px;
  }

  /* Image upload */
  .upload {
    position: relative; cursor: pointer; overflow: hidden;
    background-color: rgba(255,255,255,0.02);
  }
  .upload input[type="file"] { display: none; }
  .upload .hint {
    position: absolute; inset: 0; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--ink-dim);
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase;
    padding: 12px; text-align: center;
    background:
      repeating-linear-gradient(45deg, rgba(255,43,214,0.05) 0 2px, transparent 2px 12px),
      rgba(255,255,255,0.02);
    border: 1px dashed var(--line);
  }
  .upload .hint .icon {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 300;
  }
  .upload.has-image .hint { display: none; }
  .upload.has-image::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(0,0,0, calc(1 - var(--image-opacity, 1)));
    z-index: 2; pointer-events: none;
  }

  /* ============ PAGE 1 — COVER ============ */
  .page-cover {
    overflow: hidden; padding: 0;
    background: var(--page-bg);
  }
  .cover-bg {
    position: absolute; inset: 0; z-index: 1;
    background-size: cover; background-position: center;
  }
  .cover-bg.placeholder {
    background:
      repeating-linear-gradient(135deg, rgba(255,43,214,0.07) 0 2px, transparent 2px 14px),
      linear-gradient(180deg, #1a0c14 0%, #2a0e22 50%, #0a0608 100%);
  }
  .cover-scrim {
    position: absolute; inset: 0; z-index: 2;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(10,6,8,0.0) 0%, rgba(10,6,8,0.0) 30%, rgba(10,6,8,0.6) 65%, rgba(10,6,8,0.95) 95%),
      linear-gradient(0deg, rgba(10,6,8,0.5) 0%, transparent 30%);
  }
  .cover-corners {
    position: absolute; inset: 18px; z-index: 3; pointer-events: none;
    border: 1px solid rgba(255,43,214,0.25);
  }
  .cover-corners::before, .cover-corners::after {
    content: ""; position: absolute; width: 14px; height: 14px;
    border: 2px solid var(--accent);
  }
  .cover-corners::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
  .cover-corners::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

  .cover-top {
    position: absolute; top: 24px; left: 24px; right: 24px;
    z-index: 4; display: flex; justify-content: space-between;
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  .cover-logo { font-weight: 700; color: var(--accent); }
  .cover-center {
    position: absolute; left: 24px; right: 24px; bottom: 100px;
    z-index: 4;
  }
  .cover-marker {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 14px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  .cover-name {
    font-family: var(--display-font); font-weight: 400;
    font-size: 88px; line-height: 0.84;
    letter-spacing: 0.005em; margin: 0;
    text-transform: uppercase;
    text-shadow: 0 4px 30px rgba(0,0,0,0.7);
  }
  .cover-name .accent { color: var(--accent); }
  .cover-tagline {
    margin-top: 14px;
    font-size: 13px; line-height: 1.45;
    color: var(--ink); max-width: 90%;
    text-shadow: 0 2px 12px rgba(0,0,0,0.7);
  }
  .cover-bottom {
    position: absolute; left: 24px; right: 24px; bottom: 24px;
    z-index: 4; display: flex; gap: 18px;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 14px;
  }
  .cover-contact { flex: 1; }
  .cc-k {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 4px;
  }
  .cc-v {
    font-size: 12px; color: var(--ink); font-weight: 500;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  /* ============ PAGE 2 — BIO ============ */
  .bio-body {
    font-size: 13px; line-height: 1.55;
    color: var(--ink-soft); white-space: pre-wrap;
    margin: 0 0 18px;
  }
  .bio-divider {
    height: 1px; background: var(--line);
    margin: 6px 0 18px;
  }
  .bio-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; margin-bottom: 18px;
  }
  .bio-block {
    padding: 12px; border: 1px solid var(--line);
    border-radius: 8px;
  }
  .bio-k {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  .bio-fans, .bio-genres {
    display: flex; flex-direction: column; gap: 4px;
  }
  .fan, .genre {
    font-family: var(--display-font); font-size: 16px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink);
  }
  .genre { color: var(--accent); }
  .bio-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-top: auto;
  }
  .bs {
    padding: 10px 12px; background: rgba(255,43,214,0.04);
    border-left: 2px solid var(--accent);
  }
  .bs-k {
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 2px;
  }
  .bs-v {
    font-size: 12px; color: var(--ink); font-weight: 500;
  }

  /* ============ PAGE 3 — LIVE ============ */
  .live-photo {
    aspect-ratio: 16/10;
    border-radius: 8px; margin-bottom: 14px;
    border: 1px solid var(--line);
  }
  .video-row {
    display: grid; grid-template-columns: 130px 1fr;
    gap: 12px; margin-bottom: 18px;
  }
  .video-thumb {
    aspect-ratio: 16/10;
    border-radius: 8px; position: relative;
    border: 1px solid var(--accent-soft);
    background:
      repeating-linear-gradient(45deg, rgba(255,43,214,0.06) 0 2px, transparent 2px 12px),
      #160a12;
  }
  .vt-play {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 36px; height: 36px;
    background: var(--accent); color: #0a0608;
    border-radius: 50%; display: flex;
    align-items: center; justify-content: center;
    box-shadow: 0 0 20px var(--accent-glow);
    pointer-events: none; z-index: 4;
  }
  .vt-play svg { width: 14px; height: 14px; }
  .video-info { display: flex; flex-direction: column; gap: 4px; }
  .vi-title { font-size: 13px; font-weight: 600; color: var(--ink); }
  .vi-sub {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 6px;
  }
  .qr-box {
    margin-top: auto;
    display: flex; gap: 8px; align-items: center;
    padding: 8px; border: 1px dashed var(--accent-soft);
    border-radius: 6px;
  }
  .qr-icon {
    width: 32px; height: 32px;
    background: var(--accent); color: #0a0608;
    border-radius: 4px; display: flex;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .qr-icon svg { width: 18px; height: 18px; }
  .qr-info { min-width: 0; flex: 1; }
  .qr-k {
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .qr-v {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--accent); word-break: break-all;
  }
  .venues-label, .rb-label, .cb-label, .rel-label {
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--accent-soft);
  }
  .venues-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .venue-cell {
    position: relative;
    padding: 12px 10px; border: 1px solid var(--line);
    border-radius: 6px; text-align: center;
    font-family: var(--display-font); font-size: 16px;
    letter-spacing: 0.06em; color: var(--ink);
    text-transform: uppercase;
  }
  .cell-rm {
    position: absolute; top: 2px; right: 2px;
    width: 18px; height: 18px;
    background: rgba(255,59,59,0.8); color: #fff;
    border: none; border-radius: 50%;
    font-size: 9px; cursor: pointer;
  }
  .cell-add {
    grid-column: span 2;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--accent-soft);
    color: var(--accent);
    border-radius: 6px;
    font-family: var(--mono-font); font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer;
  }

  /* ============ PAGE 4 — MUSIC ============ */
  .mixes {
    display: flex; flex-direction: column; gap: 6px;
    margin-bottom: 16px;
  }
  .mix {
    position: relative;
    display: grid;
    grid-template-columns: 36px 1fr auto;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(255,43,214,0.04);
    border: 1px solid var(--line);
    border-radius: 8px;
    align-items: center;
  }
  .mix-icon {
    width: 30px; height: 30px;
    background: var(--accent); color: #0a0608;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .mix-icon svg { width: 12px; height: 12px; }
  .mix-meta { min-width: 0; }
  .mix-title { font-size: 12px; font-weight: 600; color: var(--ink); }
  .mix-link {
    font-family: var(--mono-font); font-size: 9px;
    color: var(--ink-dim); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mix-side {
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 2px;
  }
  .mix-platform {
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.18em; color: var(--accent);
    font-weight: 700;
  }
  .mix-duration {
    font-family: var(--mono-font); font-size: 9px;
    color: var(--ink-soft);
  }
  .mix-rm {
    position: absolute; top: 4px; right: 4px;
    width: 18px; height: 18px;
    background: rgba(255,59,59,0.8); color: #fff;
    border: none; border-radius: 50%;
    font-size: 9px; cursor: pointer;
  }

  .releases { margin-top: auto; }
  .rel-row {
    display: grid; grid-template-columns: 90px 1fr;
    gap: 12px;
  }
  .rel-art {
    aspect-ratio: 1; border-radius: 6px;
    border: 1px solid var(--accent-soft);
  }
  .rel-info { display: flex; flex-direction: column; gap: 4px; }
  .rel-title {
    font-family: var(--display-font); font-size: 22px;
    letter-spacing: 0.02em; color: var(--ink);
    text-transform: uppercase;
  }
  .rel-label-name {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent);
  }
  .rel-tracks {
    font-family: var(--mono-font); font-size: 10px;
    line-height: 1.6; color: var(--ink-soft);
    white-space: pre-wrap; margin-top: 4px;
  }

  /* ============ PAGE 5 — PRESS ============ */
  .quotes {
    display: flex; flex-direction: column;
    gap: 10px; margin-bottom: 16px;
  }
  .quote {
    position: relative;
    padding: 14px 14px 12px;
    border-left: 2px solid var(--accent);
    background: rgba(255,43,214,0.04);
    border-radius: 0 8px 8px 0;
  }
  .quote .qmark {
    position: absolute; top: -8px; left: 8px;
    width: 22px; height: 22px;
    background: var(--page-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .quote .qmark svg { width: 12px; height: 12px; }
  .quote p {
    margin: 0; font-size: 12px; line-height: 1.45;
    color: var(--ink); font-style: italic;
  }
  .qsrc {
    margin-top: 6px;
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent);
  }
  .quote-rm {
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px;
    background: rgba(255,59,59,0.8); color: #fff;
    border: none; border-radius: 50%;
    font-size: 10px; cursor: pointer;
  }

  .numbers {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-bottom: 14px;
  }
  .num-block {
    text-align: center; padding: 14px 8px;
    border: 1px solid var(--line); border-radius: 8px;
    background: rgba(255,43,214,0.03);
  }
  .num-v {
    font-family: var(--display-font); font-size: 32px;
    line-height: 1; color: var(--accent);
    text-transform: uppercase;
  }
  .num-k {
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-dim); margin-top: 6px;
  }

  .disclaimer {
    margin-top: auto;
    font-family: var(--mono-font); font-size: 9px;
    line-height: 1.5; color: var(--ink-dim);
  }

  /* ============ PAGE 6 — RIDER ============ */
  .rider-block { margin-bottom: 14px; }
  .rider-item {
    position: relative;
    display: grid; grid-template-columns: 28px 1fr auto;
    gap: 10px; align-items: center;
    padding: 8px 0; border-bottom: 1px dashed var(--line);
  }
  .ri-idx {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--accent); font-weight: 700;
  }
  .ri-name { font-size: 12px; color: var(--ink); font-weight: 500; }
  .ri-desc {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-dim); margin-top: 2px;
  }
  .ri-controls { display: flex; gap: 3px; }
  .ri-controls button {
    width: 22px; height: 22px;
    border: 1px solid var(--line);
    background: rgba(255,43,214,0.06);
    color: var(--ink); border-radius: 4px;
    cursor: pointer; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .ri-controls button.danger:hover { background: #ff3b3b; border-color: #ff3b3b; }
  .ri-controls button:disabled { opacity: 0.3; cursor: not-allowed; }

  .non-neg {
    margin: 0; padding: 0; list-style: none;
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .non-neg li {
    padding: 8px 10px;
    background: rgba(255,43,214,0.04);
    border-radius: 6px;
    font-size: 11px; color: var(--ink-soft);
  }
  .non-neg li::before {
    content: "✓";
    color: var(--accent); margin-right: 6px;
    font-weight: 700;
  }

  .contact-block { margin-top: auto; }
  .cb-field {
    display: grid; grid-template-columns: 32px 1fr;
    gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .cb-field.primary { background: rgba(255,43,214,0.06); padding: 10px 12px; border-radius: 6px; border: none; }
  .cbf-icon {
    width: 28px; height: 28px;
    background: var(--accent-soft); color: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .cbf-icon svg { width: 14px; height: 14px; }
  .cbf-k {
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .cbf-v { font-size: 12px; color: var(--ink); font-weight: 500; }
  .cb-field.primary .cbf-k { color: var(--accent); }

  .add-row {
    margin-top: 6px; width: 100%; padding: 8px;
    background: transparent;
    border: 1px dashed var(--accent-soft);
    color: var(--accent); border-radius: 6px;
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer;
  }

  /* Image controls */
  .img-control {
    position: absolute; z-index: 5;
    width: 28px; height: 28px;
    background: rgba(20,10,16,0.9);
    backdrop-filter: blur(6px);
    border: 1px solid var(--accent-soft);
    color: var(--ink); border-radius: 50%;
    cursor: pointer; font-size: 12px;
    display: none; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .upload.has-image:hover .img-control { display: flex; }
  .img-control:hover { background: var(--accent); color: #0a0608; }
  .img-opacity-btn { top: 8px; right: 40px; }
  .img-remove-btn { top: 8px; right: 8px; }
  .img-slider-pop {
    position: absolute; top: 42px; right: 8px; z-index: 6;
    background: rgba(20,10,16,0.95);
    backdrop-filter: blur(8px);
    border: 1px solid var(--accent-soft);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 6px;
    width: 180px;
  }
  .img-slider-pop label {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent);
  }
  .img-slider-pop input[type="range"] { width: 100%; accent-color: var(--accent); }
  .img-slider-pop span {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--ink-soft); text-align: right;
  }

  /* Editing mode visual */
  .is-editing .page { outline: 1px dashed rgba(255,43,214,0.25); outline-offset: -2px; }
  .page-hide {
    position: absolute; top: 8px; right: 8px; z-index: 99;
    background: rgba(255,59,59,0.85); color: #fff;
    border: none; border-radius: 6px;
    padding: 6px 10px; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    font-family: var(--mono-font);
  }

  /* Tweaks override */
  [data-tweaks-panel] button, .tweaks-panel button { color: #fff !important; }
  [data-tweaks-panel] input[type="text"],
  [data-tweaks-panel] input[type="number"],
  .tweaks-panel input[type="text"],
  .tweaks-panel input[type="number"] { color: #0a0608 !important; }

  /* Templates modal */
  .templates-modal {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(5,3,4,0.92);
    backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .templates-inner {
    width: min(1100px, 100%); max-height: 90vh;
    overflow-y: auto;
    background: #0e0710;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px;
  }
  .templates-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  .templates-head h2 {
    font-family: var(--display-font);
    font-size: 32px; letter-spacing: 0.02em;
    text-transform: uppercase; margin: 0;
  }
  .templates-head h2 .accent { color: var(--accent); }
  .templates-close {
    background: transparent; border: 1px solid var(--line);
    color: var(--ink); width: 36px; height: 36px;
    border-radius: 50%; cursor: pointer; font-size: 16px;
  }
  .templates-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }
  .template-card {
    cursor: pointer; border-radius: 10px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: all 0.15s;
    background: #1a0e15;
  }
  .template-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
  }
  .template-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .template-preview {
    aspect-ratio: 210/297;
    position: relative;
    overflow: hidden;
  }
  .template-info {
    padding: 10px 12px;
    border-top: 1px solid var(--line);
  }
  .template-name {
    font-family: var(--display-font); font-size: 16px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink);
  }
  .template-genre {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-dim); margin-top: 2px;
  }

  /* ========== BUILDER BUTTON ========== */
  .builder-btn {
    position: fixed; top: 16px; left: 250px; z-index: 1000;
    background: rgba(20,10,16,0.9); backdrop-filter: blur(8px);
    color: var(--ink); border: 1px solid var(--line);
    padding: 10px 16px; border-radius: 999px;
    font-family: var(--mono-font); font-size: 11px; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; transition: all 0.15s;
  }
  .builder-btn:hover { border-color: var(--accent-soft); color: var(--accent); }

  /* ========== MOBILE LAYOUT ========== */
  @media (max-width: 600px) {
    /* Stage: tighter padding, push content down so buttons don't overlap */
    .stage {
      padding: 110px 8px 60px !important;
      gap: 12px !important;
    }
    #root { gap: 14px !important; }

    /* Pages: full width, A4 ratio preserved */
    .page {
      width: 100% !important;
      max-width: 420px !important;
      border-radius: 6px !important;
    }

    /* Top buttons: arrange in a horizontal bar at top, smaller */
    .edit-toggle, .templates-btn, .builder-btn {
      top: 12px !important;
      padding: 8px 10px !important;
      font-size: 9px !important;
      letter-spacing: 0.10em !important;
    }
    .edit-toggle   { left: 8px !important; }
    .templates-btn { left: 95px !important; }
    .builder-btn   { left: 196px !important; }
    .download-btn {
      top: 12px !important; right: 8px !important;
      padding: 8px 10px !important;
      font-size: 9px !important;
      letter-spacing: 0.10em !important;
    }
    .download-btn svg { width: 11px !important; height: 11px !important; }

    /* Modals: take full width on mobile */
    .templates-inner, .builder-inner {
      width: 100% !important;
      padding: 16px !important;
      max-height: 95vh !important;
    }
    .builder-add-grid {
      grid-template-columns: 1fr 1fr !important;
    }
    .builder-item {
      grid-template-columns: 24px 1fr auto !important;
      padding: 8px 10px !important;
    }
    .builder-item-desc { display: none !important; }
  }

  /* ========== EXTRA-SMALL (e.g. 360px) ========== */
  @media (max-width: 400px) {
    .templates-btn { left: 88px !important; }
    .builder-btn   { left: 178px !important; }
    .edit-toggle, .templates-btn, .builder-btn {
      padding: 7px 8px !important;
      font-size: 8.5px !important;
    }
  }

  /* ========== TEMPLATE PAGES ========== */
  .template-pages {
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-dim); margin-top: 4px; line-height: 1.4;
  }

  /* ========== PAGE BUILDER MODAL ========== */
  .builder-inner {
    width: min(900px, 100%); max-height: 90vh; overflow-y: auto;
    background: #0e0710; border: 1px solid var(--line);
    border-radius: 16px; padding: 28px;
  }
  .builder-hint {
    font-family: var(--mono-font); font-size: 11px;
    color: #888; margin-top: -10px; margin-bottom: 18px;
    letter-spacing: 0.05em;
  }
  .builder-section-head {
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px;
    padding-bottom: 6px; border-bottom: 1px solid var(--accent-soft);
  }
  .builder-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .builder-item {
    display: grid; grid-template-columns: 32px 160px 1fr auto;
    gap: 12px; align-items: center;
    padding: 10px 14px; background: rgba(255,255,255,0.03);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .builder-item-num {
    font-family: var(--mono-font); font-size: 11px;
    color: var(--accent); font-weight: 700;
  }
  .builder-item-name {
    font-size: 13px; color: var(--ink); font-weight: 600;
  }
  .builder-item-desc {
    font-size: 11px; color: var(--ink-dim); line-height: 1.4;
  }
  .builder-item-ctrl { display: flex; gap: 4px; }
  .builder-item-ctrl button {
    width: 28px; height: 28px; border: 1px solid var(--line);
    background: rgba(255,43,214,0.06); color: var(--ink);
    border-radius: 6px; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
  }
  .builder-item-ctrl button.danger:hover { background: #ff3b3b; border-color: #ff3b3b; }
  .builder-item-ctrl button:disabled { opacity: 0.3; cursor: not-allowed; }

  .builder-add-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .builder-add-card {
    text-align: left; padding: 14px; cursor: pointer;
    background: rgba(255,43,214,0.04);
    border: 1px solid var(--line); border-radius: 10px;
    transition: all 0.15s; color: var(--ink);
    font-family: inherit;
  }
  .builder-add-card:hover {
    border-color: var(--accent); background: rgba(255,43,214,0.10);
    transform: translateY(-2px);
  }
  .builder-add-name {
    font-size: 13px; font-weight: 700; color: var(--ink);
    margin-bottom: 4px;
  }
  .builder-add-desc {
    font-size: 10px; color: var(--ink-dim); line-height: 1.4;
    margin-bottom: 8px;
  }
  .builder-add-plus {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.18em; color: var(--accent); font-weight: 700;
  }

  /* ========== DISCOGRAPHY ========== */
  .disco-list { display: flex; flex-direction: column; gap: 4px; }
  .disco-head {
    display: grid; grid-template-columns: 50px 1.4fr 1fr 60px;
    gap: 10px;
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-dim); padding: 6px 4px;
    border-bottom: 1px solid var(--accent-soft);
  }
  .disco-row {
    position: relative;
    display: grid; grid-template-columns: 50px 1.4fr 1fr 60px;
    gap: 10px; align-items: center;
    padding: 10px 4px; border-bottom: 1px dashed var(--line);
    font-size: 11px;
  }
  .disco-year {
    font-family: var(--mono-font); color: var(--accent);
    font-weight: 700;
  }
  .disco-title { color: var(--ink); font-weight: 600; }
  .disco-label { color: var(--ink-soft); font-size: 10px; }
  .disco-type {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); padding: 2px 6px;
    border: 1px solid var(--accent-soft); border-radius: 3px;
    text-align: center; width: fit-content;
  }
  .disco-rm {
    position: absolute; top: 4px; right: 4px;
    width: 18px; height: 18px;
    background: rgba(255,59,59,0.8); color: #fff;
    border: none; border-radius: 50%;
    font-size: 9px; cursor: pointer;
  }

  /* ========== MANIFESTO ========== */
  .page-manifesto {
    display: flex; flex-direction: column;
    padding: 28px 26px 56px;
  }
  .manifesto-mark {
    font-size: 36px; color: var(--accent);
    margin-bottom: 10px;
  }
  .manifesto-h {
    font-family: var(--display-font); font-weight: 400;
    font-size: 60px; line-height: 0.86;
    letter-spacing: 0.005em; margin: 0 0 24px;
    text-transform: uppercase;
  }
  .manifesto-h .accent { color: var(--accent); }
  .manifesto-body {
    font-size: 13px; line-height: 1.6;
    color: var(--ink-soft); white-space: pre-wrap;
    margin: 0 0 auto;
  }
  .manifesto-sig {
    margin-top: 24px;
    display: flex; justify-content: space-between;
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink); padding-top: 14px;
    border-top: 1px solid var(--line);
  }
  .manifesto-sig .accent { color: var(--accent); }

  /* ========== FESTIVALS ========== */
  .fest-flyer {
    aspect-ratio: 16/10;
    border-radius: 8px; margin-bottom: 14px;
    border: 1px solid var(--accent-soft);
  }
  .fest-list { display: flex; flex-direction: column; gap: 4px; }
  .fest-row {
    position: relative;
    display: grid; grid-template-columns: 60px 1fr 40px;
    gap: 10px; align-items: center;
    padding: 10px 4px; border-bottom: 1px dashed var(--line);
  }
  .fest-year {
    font-family: var(--mono-font); font-size: 11px;
    color: var(--accent); font-weight: 700;
  }
  .fest-mid { min-width: 0; }
  .fest-name {
    font-family: var(--display-font); font-size: 16px;
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink);
  }
  .fest-tier {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-dim); margin-top: 2px;
  }
  .fest-country {
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.12em; color: var(--accent);
    text-align: right; font-weight: 700;
  }

  /* ========== SERVICES ========== */
  .services-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-bottom: 18px;
  }
  .service-card {
    position: relative;
    padding: 16px 10px 14px; text-align: center;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .service-card.highlight {
    background: rgba(255,43,214,0.10);
    border-color: var(--accent);
    box-shadow: 0 4px 20px var(--accent-soft);
  }
  .srv-tag {
    position: absolute; top: -8px; left: 50%;
    transform: translateX(-50%);
    background: var(--accent); color: #0a0608;
    padding: 3px 10px; border-radius: 999px;
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.18em; font-weight: 700;
    text-transform: uppercase; white-space: nowrap;
  }
  .srv-name {
    font-family: var(--display-font); font-size: 18px;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink); margin-bottom: 4px;
  }
  .srv-hours {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px;
  }
  .srv-inc {
    font-size: 10px; line-height: 1.5;
    color: var(--ink-soft); margin-bottom: 10px;
    min-height: 30px;
  }
  .srv-price {
    font-family: var(--display-font); font-size: 22px;
    letter-spacing: 0.02em; color: var(--accent);
    text-transform: uppercase;
    padding-top: 10px; border-top: 1px solid var(--line);
  }
  .srv-note {
    margin-top: auto; font-family: var(--mono-font);
    font-size: 9px; line-height: 1.5; color: var(--ink-dim);
  }

  /* ========== TIMELINE ========== */
  .timeline {
    position: relative; padding-left: 30px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .timeline-line {
    position: absolute; left: 7px; top: 6px; bottom: 6px;
    width: 1px; background: var(--accent-soft);
  }
  .timeline-item {
    position: relative;
    display: grid; grid-template-columns: 60px 1fr;
    gap: 10px; align-items: center;
  }
  .tl-dot {
    position: absolute; left: -28px; top: 50%;
    transform: translateY(-50%);
    width: 12px; height: 12px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 0 3px var(--page-bg), 0 0 12px var(--accent-glow);
  }
  .tl-year {
    font-family: var(--display-font); font-size: 18px;
    color: var(--accent); letter-spacing: 0.04em;
  }
  .tl-event { font-size: 12px; color: var(--ink); line-height: 1.4; }

  /* ========== TOUR MAP ========== */
  .map-frame {
    aspect-ratio: 2/1; margin-bottom: 14px;
    border: 1px solid var(--accent-soft);
    border-radius: 8px; overflow: hidden;
    background: rgba(255,43,214,0.04);
    padding: 10px;
  }
  .world-svg { width: 100%; height: 100%; }
  .world-svg path {
    fill: rgba(255,255,255,0.06);
    stroke: var(--accent-soft); stroke-width: 0.3;
  }
  .world-svg .map-dot { fill: var(--accent); }
  .tour-list { display: flex; flex-direction: column; gap: 4px; }
  .tour-row {
    position: relative;
    display: grid; grid-template-columns: 70px 1fr 40px;
    gap: 10px; align-items: center;
    padding: 8px 4px; border-bottom: 1px dashed var(--line);
  }
  .tour-date {
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.14em; color: var(--accent);
    font-weight: 700; text-transform: uppercase;
  }
  .tour-city {
    font-family: var(--display-font); font-size: 16px;
    letter-spacing: 0.04em; color: var(--ink);
    text-transform: uppercase;
  }
  .tour-country {
    font-family: var(--mono-font); font-size: 10px;
    color: var(--ink-dim); text-align: right;
  }

  /* ========== BRANDS ========== */
  .brands-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .brand-card {
    position: relative;
    padding: 16px 14px;
    background: rgba(255,43,214,0.04);
    border: 1px solid var(--line); border-radius: 10px;
    text-align: center;
  }
  .brand-name {
    font-family: var(--display-font); font-size: 22px;
    letter-spacing: 0.04em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 6px;
  }
  .brand-act {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft); line-height: 1.4;
  }

  /* ========== RADIO ========== */
  .radio-card {
    padding: 18px; margin-bottom: 18px;
    background: linear-gradient(135deg, var(--accent-soft), rgba(255,255,255,0.02));
    border: 1px solid var(--accent); border-radius: 10px;
    box-shadow: 0 0 24px var(--accent-soft);
  }
  .radio-onair {
    display: inline-block;
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.22em; color: #fff; font-weight: 700;
    background: var(--accent); padding: 3px 8px;
    border-radius: 3px; margin-bottom: 12px;
    animation: blink 2s infinite;
  }
  @keyframes blink { 50% { opacity: 0.5; } }
  .radio-name {
    font-family: var(--display-font); font-size: 28px;
    letter-spacing: 0.04em; color: var(--ink);
    text-transform: uppercase; margin-bottom: 4px;
  }
  .radio-meta {
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.14em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 10px;
  }
  .radio-desc { font-size: 12px; color: var(--ink-soft); line-height: 1.5; }
  .radio-eps-label {
    font-family: var(--mono-font); font-size: 10px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--accent-soft);
  }
  .radio-ep {
    display: grid; grid-template-columns: 60px 1fr 80px;
    gap: 10px; align-items: center;
    padding: 8px 4px; border-bottom: 1px dashed var(--line);
  }
  .radio-ep-num {
    font-family: var(--mono-font); font-size: 11px;
    color: var(--accent); font-weight: 700;
  }
  .radio-ep-guest { font-size: 11px; color: var(--ink); }
  .radio-ep-date {
    font-family: var(--mono-font); font-size: 9px;
    color: var(--ink-dim); text-align: right;
    letter-spacing: 0.1em;
  }

  /* ========== STREAMING ========== */
  .stream-hero {
    display: grid; grid-template-columns: 130px 1fr;
    gap: 12px; margin-bottom: 18px;
  }
  .stream-hero-img {
    aspect-ratio: 16/10; border-radius: 8px;
    border: 1px solid var(--accent-soft);
  }
  .stream-hero-info { display: flex; flex-direction: column; gap: 4px; }
  .stream-hero-tag {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.18em; color: var(--accent);
    font-weight: 700; text-transform: uppercase;
  }
  .stream-hero-title {
    font-family: var(--display-font); font-size: 22px;
    letter-spacing: 0.02em; color: var(--ink);
    text-transform: uppercase; line-height: 1;
  }
  .stream-hero-stats {
    display: flex; gap: 8px; font-family: var(--mono-font);
    font-size: 10px; color: var(--ink-soft);
    letter-spacing: 0.1em; margin-top: auto;
  }
  .stream-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stream-card {
    padding: 14px 12px; text-align: center;
    background: rgba(255,43,214,0.04);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .stream-pf {
    font-family: var(--mono-font); font-size: 9px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  .stream-num {
    font-family: var(--display-font); font-size: 32px;
    line-height: 1; color: var(--ink);
    text-transform: uppercase;
  }
  .stream-lbl {
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ink-dim); margin-top: 6px;
  }

  /* ========== CONTACT-ONLY ========== */
  .contact-only-center {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
  }
  .contact-only-mark {
    font-size: 32px; color: var(--accent);
    margin-bottom: 16px;
  }
  .contact-only-h {
    font-family: var(--display-font); font-weight: 400;
    font-size: 60px; line-height: 0.86;
    letter-spacing: 0.005em; margin: 0 0 14px;
    text-transform: uppercase;
  }
  .contact-only-h .accent { color: var(--accent); }
  .contact-only-sub {
    font-size: 13px; line-height: 1.5;
    color: var(--ink-soft); white-space: pre-wrap;
    margin: 0 0 30px;
  }
  .contact-only-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; width: 100%;
  }
  .co-block {
    padding: 12px; background: rgba(255,43,214,0.04);
    border: 1px solid var(--line); border-radius: 8px;
    text-align: left;
  }
  .co-k {
    font-family: var(--mono-font); font-size: 8px;
    letter-spacing: 0.18em; color: var(--accent);
    margin-bottom: 4px;
  }
  .co-v { font-size: 12px; color: var(--ink); font-weight: 500; }

  /* ========== INLINE LINKS (LinkField) ========== */
  /* When not editing, LinkField renders an <a>. Style so it reads as a link
     but matches each context (cv-*, ct-*, mix-link, qr-v). */
  .cc-v a, .cbf-v a, .qr-v a, .mix-link a {
    color: inherit;
    text-decoration: underline;
    text-decoration-color: var(--accent-soft);
    text-underline-offset: 3px;
    transition: color 0.15s, text-decoration-color 0.15s;
  }
  .cc-v a:hover, .cbf-v a:hover, .qr-v a:hover, .mix-link a:hover {
    color: var(--accent);
    text-decoration-color: var(--accent);
  }
  .mix-link a { color: var(--ink-dim); }
  .mix-link a:hover { color: var(--accent); }

  /* In print: links should be visible as clickable in the PDF.
     Browsers (Chrome/Safari) preserve <a href> as embedded hyperlinks
     in the printed PDF automatically — we just keep them styled. */
  @media print {
    .cc-v a, .cbf-v a, .qr-v a, .mix-link a {
      text-decoration: underline !important;
      text-decoration-color: var(--accent) !important;
      color: inherit !important;
    }
  }

  /* Print: include images and backgrounds */
  @media print {
    @page { size: A4; margin: 0; }
    html, body {
      background: #fff !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .stage {
      padding: 0 !important;
      background: var(--page-bg) !important;
      min-height: 0 !important;
      gap: 0 !important;
    }
    #root { gap: 0 !important; width: 100% !important; }

    /* Wrapper around each page: holds A4 dimensions for pagination */
    .page-wrap {
      width: 210mm !important;
      height: 297mm !important;
      page-break-after: always !important;
      break-after: page !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
      overflow: hidden !important;
      position: relative !important;
      display: block !important;
      background: var(--page-bg) !important;
    }
    .page-wrap:last-child { page-break-after: auto !important; break-after: auto !important; }

    /* The .page itself stays at its design size (440px wide, A4 ratio)
       and we scale it up to fill the A4 wrapper — this preserves all
       layout/spacing exactly as it appears on screen. */
    .page {
      width: 440px !important;
      height: calc(440px * 297 / 210) !important;
      aspect-ratio: auto !important;
      max-width: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      transform: scale(calc(210mm / 440px)) !important;
      transform-origin: top left !important;
      position: absolute !important;
      top: 0 !important; left: 0 !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .upload, .upload * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Hide all UI chrome */
    .download-btn, .edit-toggle, .templates-btn, .builder-btn,
    [data-tweaks-panel], .tweaks-panel,
    .page-hide, .ri-controls, .cell-rm, .cell-add,
    .quote-rm, .mix-rm, .disco-rm, .add-row,
    .img-control, .img-slider-pop { display: none !important; }
    .upload .hint { display: none !important; }

    /* Make all editable text behave like normal text in print */
    [contenteditable] { 
      outline: none !important; 
      box-shadow: none !important; 
      background: transparent !important;
    }
  }
</style>
